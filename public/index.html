<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>후보님! 응원합니다!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">후보님! 응원합니다💪</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form id="messageForm">
                            <div class="mb-3">
                                <label for="messageInput" class="form-label">응원 메시지를 입력하세요</label>
                                <textarea class="form-control" id="messageInput" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">메시지 남기기</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <h2 class="text-center mb-3">캠프원들의 응원 메시지💙</h2>
                <div id="messageList" class="message-list"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.8.1/firebase-database.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
